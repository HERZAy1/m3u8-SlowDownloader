  <rect x="44" y="34" width="42" height="42" rx="11" fill="url(#mark)" />
  <g stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M65 46v9.6" />
    <path d="m59.2 52.3 5.8 5.8 5.8-5.8" />
    <path d="M54.5 67h21" />
  </g>
  <text x="98" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="24" font-weight="700" fill="#eef1f8">m3u8 Downloader</text>

  <!-- 主标题 -->
  <text x="44" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="30" font-weight="700" fill="url(#accent)">像播放器一样把视频下载下来</text>
  <text x="44" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13.5" fill="#8b93a7">按 <tspan font-family="'Cascadia Mono', Consolas, monospace" fill="#b9c0cf">#EXTINF</tspan> 节奏逐片请求 · 默认 2x · 不触发过流风控</text>

  <!-- 卖点胶囊 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#8b93a7">
    <rect x="44" y="190" width="58" height="24" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="73" y="206" text-anchor="middle">零依赖</text>
    <rect x="110" y="190" width="78" height="24" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="149" y="206" text-anchor="middle">断电续传</text>
    <rect x="196" y="190" width="78" height="24" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="235" y="206" text-anchor="middle">GUI + CLI</text>
    <rect x="282" y="190" width="96" height="24" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="330" y="206" text-anchor="middle">输出原始 .ts</text>
  </g>

  <!-- 右侧时间轴卡片 -->
  <rect x="520" y="34" width="336" height="176" rx="14" fill="#0e1119" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="540" y="66" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" letter-spacing="1.1" fill="#5b6478">播放时间轴</text>
  <text x="540" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="700" fill="#e9ecf3">48.6%</text>
  <text x="836" y="110" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#6d768a">1074 片 · 01:34:02</text>

  <!-- 进度（虚线分片） -->
  <line x1="540" y1="148" x2="836" y2="148" stroke="#1b2130" stroke-width="11" stroke-dasharray="7 5" />
  <g clip-path="url(#played)">
    <line x1="540" y1="148" x2="836" y2="148" stroke="url(#bar)" stroke-width="11" stroke-dasharray="7 5" />
  </g>
  <rect x="683" y="134" width="2" height="28" rx="1" fill="#dfe6ff" />
  <circle cx="684" cy="148" r="4.2" fill="#ffffff" />

  <text x="540" y="180" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#5b6478">已下载 521 片 · 2.3 MB/s · 抖动 ±300ms</text>
