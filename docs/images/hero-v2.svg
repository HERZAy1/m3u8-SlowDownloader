<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="m3u8 Downloader — 像播放器一样下载">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a0f" />
      <stop offset="0.55" stop-color="#0b0e15" />
      <stop offset="1" stop-color="#0a0c13" />
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c96ff" />
      <stop offset="0.55" stop-color="#6b5cff" />
      <stop offset="1" stop-color="#9a6cff" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d9bff" />
      <stop offset="1" stop-color="#b78cff" />
    </linearGradient>
    <linearGradient id="bar" x1="540" y1="0" x2="836" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b78f5" />
      <stop offset="1" stop-color="#8ea8ff" />
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6b8cff" stop-opacity="0.30" />
      <stop offset="1" stop-color="#6b8cff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9a6cff" stop-opacity="0.26" />
      <stop offset="1" stop-color="#9a6cff" stop-opacity="0" />
    </radialGradient>
    <clipPath id="played">
      <rect x="540" y="132" width="144" height="32" />
    </clipPath>
  </defs>

  <rect width="900" height="250" rx="16" fill="url(#bg)" />
  <ellipse cx="120" cy="-40" rx="320" ry="200" fill="url(#glowA)" />
  <ellipse cx="840" cy="20" rx="300" ry="200" fill="url(#glowB)" />
  <rect x="0.5" y="0.5" width="899" height="249" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.06" />

