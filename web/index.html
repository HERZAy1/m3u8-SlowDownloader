<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>m3u8 Downloader</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="brand">
        <span class="mark">▶</span>
        <span class="name">m3u8 Downloader</span>
        <span class="ver">v0.2.0</span>
      </div>
      <a class="gh" href="https://github.com/HERZAy1/m3u8-Downloader" target="_blank" rel="noopener">GitHub ↗</a>
    </div>

    <main>
      <section class="card">
        <label class="field wide">
          <span class="label">播放列表地址（每行一个，可一次粘贴多个）</span>
          <textarea
            id="urls"
            rows="3"
            placeholder="https://…/play-1.m3u8&#10;https://…/play-2.m3u8"
            spellcheck="false"
          ></textarea>
        </label>

        <div class="grid">
          <div class="field">
            <span class="label">倍速</span>
            <input id="speed" type="number" value="2" min="0" max="50" step="0.5" />
            <div class="chips" id="speedchips">
              <button type="button" data-speed="1">1x</button>
              <button type="button" data-speed="2">2x</button>
              <button type="button" data-speed="4">4x</button>
              <button type="button" data-speed="8">8x</button>
            </div>
          </div>
          <label class="field">
            <span class="label">抖动 (ms)</span>
            <input id="jitter" type="number" value="300" min="0" max="5000" step="50" />
          </label>
          <label class="field">
            <span class="label">重试次数</span>
            <input id="retries" type="number" value="3" min="0" max="10" step="1" />
          </label>
          <label class="field">
            <span class="label">只下前 N 片</span>
            <input id="limit" type="number" placeholder="全部" min="1" step="1" />
          </label>
        </div>

        <div class="grid grid-2">
          <label class="field">
            <span class="label">备注（留空则用原文件名）</span>
            <input id="note" type="text" placeholder="例：第 3 讲 网络协议" autocomplete="off" />
          </label>
          <label class="field">
            <span class="label">输出目录（有备注时以备注为准）</span>
            <input
              id="out"
              type="text"
              placeholder="留空 = downloads/&lt;任务名&gt;"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
        </div>

        <div class="actions">
          <button id="enqueue">加入队列</button>
          <button id="start" class="primary">开始队列</button>
          <button id="pause" disabled>暂停</button>
          <button id="stop" disabled>停止</button>
          <button id="clear" class="ghost">清空已完成</button>
          <label class="check"><input id="remux" type="checkbox" /> 用 ffmpeg 修复时间戳</label>
        </div>
      </section>

      <section class="card queue-card">
        <div class="queue-head">
          <span class="queue-title">队列</span>
          <span id="queuecount" class="queue-count">0 / 20</span>
          <span id="queuetotal" class="queue-total"></span>
          <span class="grow"></span>
          <span id="queuesummary" class="queue-summary"></span>
        </div>
        <div id="queuelist" class="queue-list">
          <div class="queue-empty" id="queueempty">队列为空 —— 粘贴地址后点「加入队列」</div>
        </div>
      </section>

      <section id="results" class="card results" hidden>
        <div class="results-head">
          <span class="results-title">结果</span>
          <span id="resultsummary" class="results-summary"></span>
          <span class="grow"></span>
          <button id="retryall" class="primary small" hidden>补齐全部缺失</button>
          <button id="clearresults" class="small">清空结果</button>
        </div>
        <div id="resultlist" class="results-list"></div>
      </section>

      <section class="card files-card">
        <div class="files-head">
          <span class="files-title">文件</span>
          <span id="filessummary" class="files-summary"></span>
          <span class="grow"></span>
          <button id="refreshfiles" class="small">刷新</button>
        </div>
        <div id="filelist" class="files-list">
          <div class="files-empty">正在扫描…</div>
        </div>
      </section>

      <section class="card term">
        <div class="term-head">
          <span class="dot idle" id="dot"></span>
          <span id="termstate">就绪</span>
          <span class="grow"></span>
          <span id="termjob"></span>
          <span id="termspeed">—</span>
        </div>

        <div class="progress-strip">
          <div class="progress-top">
            <div class="bar"><div id="fill"></div></div>
            <span id="pct" class="pct">0.0%</span>
          </div>
          <div class="progress-meta">
            <span id="count">—</span>
            <span id="elapsed">已用 —</span>
            <span id="eta">剩余 —</span>
            <span id="size">—</span>
            <span id="retrynote" class="retry-note"></span>
          </div>
        </div>

        <div id="log" class="log" role="log" aria-live="off">
          <div class="empty" id="empty">
            <b>等待任务</b>
            <span>填入 m3u8 地址后点「开始队列」，这里会逐片实时输出。</span>
          </div>
        </div>
      </section>

      <footer>
        <span>仅用于下载你有权访问的内容 · 全部在本地运行，不收集任何数据</span>
        <span>MIT License</span>
      </footer>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
