<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>m3u8 下载器</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>m3u8 下载器</h1>
        <p class="sub">按 <code>#EXTINF</code> 节奏缓速下载，输出原始 <code>.ts</code></p>
      </header>

      <section class="card">
        <label class="field wide">
          <span>播放列表地址</span>
          <input id="url" type="url" placeholder="https://…/play.m3u8" autocomplete="off" />
        </label>

        <div class="grid">
          <label class="field">
            <span>倍速</span>
            <input id="speed" type="number" value="2" min="0" step="0.5" />
          </label>
          <label class="field">
            <span>抖动 (ms)</span>
            <input id="jitter" type="number" value="300" min="0" step="50" />
          </label>
          <label class="field">
            <span>重试次数</span>
            <input id="retries" type="number" value="3" min="0" step="1" />
          </label>
          <label class="field">
            <span>只下前 N 片</span>
            <input id="limit" type="number" placeholder="全部" min="1" step="1" />
          </label>
        </div>

        <label class="field wide">
          <span>输出目录</span>
          <input id="out" type="text" placeholder="留空则自动命名为 downloads/&lt;任务名&gt;" autocomplete="off" />
        </label>

        <div class="actions">
          <button id="start" class="primary">开始下载</button>
          <button id="pause" disabled>暂停</button>
          <button id="cancel" disabled>取消</button>
          <label class="check"><input id="remux" type="checkbox" /> 拼接后用 ffmpeg 修复时间戳</label>
        </div>
      </section>

      <section class="card">
        <div class="bar"><div id="fill"></div></div>
        <div class="stats">
          <div><b id="pct">0.0%</b><span>进度</span></div>
          <div><b id="count">—</b><span>分片</span></div>
          <div><b id="elapsed">—</b><span>已用</span></div>
          <div><b id="eta">—</b><span>剩余</span></div>
          <div><b id="size">—</b><span>已下载</span></div>
        </div>
      </section>

      <section id="result" class="card result" hidden>
        <div class="meta">
          <b id="resultname">—</b>
          <span id="resultsize"></span>
        </div>
        <a id="download" class="primary" href="/api/download" download>下载文件</a>
      </section>

      <pre id="log" class="log"></pre>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
