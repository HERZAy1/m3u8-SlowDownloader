<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>m3u8 Downloader</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="brand">
        <span class="mark">▶</span>
        <span class="name">m3u8 Downloader</span>
        <span class="ver">v0.1.0</span>
      </div>
      <a class="gh" href="https://github.com/HERZAy1/m3u8-Downloader" target="_blank" rel="noopener">GitHub ↗</a>
    </div>

    <main>
      <section class="card">
        <label class="field wide">
          <span class="label">播放列表地址</span>
          <input
            id="url"
            type="url"
            placeholder="https://…/play.m3u8"
            autocomplete="off"
            spellcheck="false"
          />
        </label>

        <div class="grid">
          <div class="field">
            <span class="label">倍速</span>
            <input id="speed" type="number" value="2" min="0" max="50" step="0.5" />
            <div class="chips" id="speedchips">
              <button type="button" data-speed="1">1x</button>
              <button type="button" data-speed="2">2x</button>
              <button type="button" data-speed="4">4x</button>
              <button type="button" data-speed="8">8x</button>
            </div>
          </div>
          <label class="field">
            <span class="label">抖动 (ms)</span>
            <input id="jitter" type="number" value="300" min="0" max="5000" step="50" />
          </label>
          <label class="field">
            <span class="label">重试次数</span>
            <input id="retries" type="number" value="3" min="0" max="10" step="1" />
          </label>
          <label class="field">
            <span class="label">只下前 N 片</span>
            <input id="limit" type="number" placeholder="全部" min="1" step="1" />
          </label>
        </div>

        <label class="field wide">
          <span class="label">输出目录</span>
          <input
            id="out"
            type="text"
            placeholder="留空 = downloads/&lt;任务名&gt;"
            autocomplete="off"
            spellcheck="false"
          />
        </label>

        <div class="actions">
          <button id="start" class="primary">开始下载</button>
          <button id="pause" disabled>暂停</button>
          <button id="cancel" disabled>取消</button>
          <label class="check"><input id="remux" type="checkbox" /> 用 ffmpeg 修复时间戳</label>
          <span class="hint">Enter 开始 · Esc 取消</span>
        </div>
      </section>

      <section class="card">
        <div class="bar"><div id="fill"></div></div>
        <div class="stats">
          <div><b id="pct">0.0%</b><span>进度</span></div>
          <div><b id="count">—</b><span>分片</span></div>
          <div><b id="elapsed">—</b><span>已用</span></div>
          <div><b id="eta">—</b><span>剩余</span></div>
          <div><b id="size">—</b><span>已下载</span></div>
        </div>
      </section>

      <section id="result" class="card result" hidden>
        <div class="meta">
          <b id="resultname">—</b>
          <span id="resultsize"></span>
        </div>
        <div class="result-actions">
          <button id="cleanup" title="删除已合并的分片，释放磁盘空间（删除后无法续传）">清理分片</button>
          <a id="download" class="primary" href="/api/download" download>下载文件</a>
        </div>
      </section>

      <section class="card term">
        <div class="term-head">
          <span class="dot idle" id="dot"></span>
          <span id="termstate">就绪</span>
          <span class="grow"></span>
          <span id="termspeed">—</span>
          <span id="termcount">—</span>
        </div>
        <div id="log" class="log" role="log" aria-live="off">
          <div class="empty" id="empty">
            <b>等待任务</b>
            <span>填入 m3u8 地址后点「开始下载」，这里会逐片实时输出。</span>
          </div>
        </div>
      </section>

      <footer>
        <span>仅用于下载你有权访问的内容 · 全部在本地运行，不收集任何数据</span>
        <span>MIT License</span>
      </footer>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
